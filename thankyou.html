<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Thank You – Pet Tracks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg:#f6f7ff;
      --card:#fff;
      --text:#202236;
      --muted:#6f7291;
      --accent:#5b5fff;
      --radius:16px;
    }

    body {
      margin:0;
      padding:0;
      background:var(--bg);
      font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      color:var(--text);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
    }

    .card {
      background:var(--card);
      padding:2.5rem 2.2rem;
      border-radius:var(--radius);
      box-shadow:0 20px 40px rgba(0,0,0,.08);
      max-width:500px;
      width:90%;
    }

    h1 {
      font-size:1.8rem;
      margin-top:0;
    }

    p {
      font-size:1rem;
      color:var(--muted);
      margin:1rem 0 1.5rem;
      line-height:1.45;
    }
    
    .btn {
      display:inline-block;
      margin-top:1rem;
      padding:.75rem 1.5rem;
      background:var(--accent);
      color:#fff;
      border-radius:999px;
      text-decoration:none;
      font-weight:600;
      box-shadow:0 8px 16px rgba(91,95,255,.25);
      transition:0.2s;
    }

    .btn:hover {
      background:#3a3dff;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Thank you for your order! 🐾🎶</h1>
    <p>
      Your submission has been received and our Pet Tracks team is already wagging their tails with excitement!
      We’ll review your pet’s details and start crafting your custom song (and album cover if selected).
    </p>

    <a href="index.html" class="btn">Back to Home</a>
  </div>
</body>
</html>
